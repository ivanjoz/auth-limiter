name: Build and release Linux binaries

# Version tags publish; manual runs validate both architectures without touching Releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A release tag must have only one publisher, and a running release must finish atomically.
concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: auth-limiter (${{ matrix.asset_architecture }})
    env:
      # Apply the pin even to cache metadata commands that execute outside the crate directory.
      RUSTUP_TOOLCHAIN: 1.95.0
    strategy:
      # One architecture failing must not hide whether the other one builds.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            asset_architecture: amd64
            expected_machine: x86-64
          # A native ARM runner, not a cross-build: the tests then run on the architecture they
          # ship for, which is the only way the aarch64 binary is covered by anything.
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            asset_architecture: arm64
            expected_machine: ARM aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust target
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          # Install only this matrix target; the other architecture has its own runner.
          rustup toolchain install 1.95.0 \
            --profile minimal \
            --target "$RUST_TARGET" \
            --no-self-update

      - name: Restore Rust dependency cache
        # Swatinem/rust-cache v2 is pinned to its immutable commit, not a moving tag.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.rust_target }}
          cache-bin: false
          # Tags restore the default-branch cache but do not save isolated tag caches.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test natively
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: cargo test --locked --release --target "$RUST_TARGET"

      - name: Build static binary
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          ASSET_ARCHITECTURE: ${{ matrix.asset_architecture }}
        run: |
          # The checked-in .cargo/config.toml makes each musl output self-contained.
          cargo build --locked --release --target "$RUST_TARGET"
          mkdir -p dist
          install -m 0755 \
            "target/${RUST_TARGET}/release/auth-limiter" \
            "dist/auth-limiter_linux_${ASSET_ARCHITECTURE}"

      - name: Verify ELF file
        env:
          ASSET_ARCHITECTURE: ${{ matrix.asset_architecture }}
          EXPECTED_MACHINE: ${{ matrix.expected_machine }}
        run: |
          # Validate the renamed release file, not only Cargo's target-directory output.
          binary_path="dist/auth-limiter_linux_${ASSET_ARCHITECTURE}"
          binary_description="$(file -b "$binary_path")"
          echo "${binary_path}: ${binary_description}"
          if [[ "$binary_description" != *"$EXPECTED_MACHINE"* ]]; then
            echo "Expected machine ${EXPECTED_MACHINE}" >&2
            exit 1
          fi
          # A static musl build is the whole point: a dynamic loader here means the deploy host
          # would need a matching libc, which is exactly what installing a prebuilt binary avoids.
          if readelf -l "$binary_path" | grep -q 'Requesting program interpreter'; then
            echo "${binary_path} unexpectedly requires a dynamic loader" >&2
            exit 1
          fi

      - name: Stage binary for the publisher
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: auth-limiter-${{ matrix.asset_architecture }}
          path: dist/auth-limiter_linux_${{ matrix.asset_architecture }}
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download staged binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify release bundle and create checksums
        run: |
          # Require the complete bundle before generating a manifest or contacting Releases:
          # a release carrying one architecture would install fine on that host and fail silently
          # on the other.
          expected_asset_names=(
            auth-limiter_linux_amd64
            auth-limiter_linux_arm64
          )

          found_asset_count="$(find dist -maxdepth 1 -type f | wc -l)"
          if [[ "$found_asset_count" -ne "${#expected_asset_names[@]}" ]]; then
            echo "Expected ${#expected_asset_names[@]} binaries, found ${found_asset_count}" >&2
            find dist -maxdepth 1 -type f -print
            exit 1
          fi

          for asset_name in "${expected_asset_names[@]}"; do
            asset_path="dist/${asset_name}"
            if [[ ! -s "$asset_path" ]]; then
              echo "Missing or empty release asset: ${asset_path}" >&2
              exit 1
            fi
            chmod 0755 "$asset_path"
            file "$asset_path"
            if readelf -l "$asset_path" | grep -q 'Requesting program interpreter'; then
              echo "${asset_path} unexpectedly requires a dynamic loader" >&2
              exit 1
            fi
          done

          # Bare filenames let sha256sum verify files downloaded into any directory, which is how
          # the genix deployer checks them after pulling them into its own tmp/.
          (
            cd dist
            sha256sum "${expected_asset_names[@]}" > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh creates a draft, uploads the validated bundle, then publishes it as one release.
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "auth-limiter ${GITHUB_REF_NAME}"
